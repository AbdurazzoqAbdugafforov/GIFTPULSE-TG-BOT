services:
  postgres:
    image: postgres:16-alpine
    container_name: giftpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: giftpulse
      POSTGRES_PASSWORD: giftpulse_password
      POSTGRES_DB: giftpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giftpulse -d giftpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: giftpulse_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot migration and initial seed container
  migrator:
    build: .
    container_name: giftpulse_migrator
    command: >
      sh -c "alembic upgrade head && python scripts/seed_data.py"
    environment:
      - DATABASE_URL=postgresql+asyncpg://giftpulse:giftpulse_password@postgres:5432/giftpulse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    container_name: giftpulse_bot
    restart: unless-stopped
    command: ["python", "-m", "app.main", "--bot"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://giftpulse:giftpulse_password@postgres:5432/giftpulse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    build: .
    container_name: giftpulse_worker
    restart: unless-stopped
    command: ["python", "-m", "app.main", "--worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://giftpulse:giftpulse_password@postgres:5432/giftpulse
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  api:
    build: .
    container_name: giftpulse_api
    restart: unless-stopped
    command: ["python", "-m", "app.main", "--api"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://giftpulse:giftpulse_password@postgres:5432/giftpulse
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
